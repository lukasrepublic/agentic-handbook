# Enforces FG-SEC-024. Copy this file into .github/workflows/ and rename it to .yml.
# The rule file is security-checks/gitleaks.toml (copied from the kit's checks/); GITLEAKS_CONFIG below points at it.
# On organization repositories the action also needs a GITLEAKS_LICENSE secret.
name: secret-scan
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ci-gitleaks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security-checks/gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # required for organization repositories
