# governance-trace — ties each pull request to its ticket's `## Design` (copy to
# `.github/workflows/governance-trace.yml`). The governance kit ships the same job:
# `governance/kits/delivery/checks/governance-trace.yml.template` in the plugin.
#
# It is its own workflow on purpose: its own concurrency group, so an edit of the PR title or body
# never cancels a running `test` in ci.yml; and no `paths-ignore`, so a docs-only PR still reports
# the check (a skipped required check counts as passing, a missing one blocks forever).
#
# Policy, trusted operators and trust boundaries are read from the PR's BASE commit, so a PR cannot
# loosen the class that grades it. The PR checkout is only read. The check runs from the plugin at the
# version in `.foundry/governance.lock`: replace <PLUGIN_REF> with that version's 40-character commit,
# then add `governance-trace` to the base branch's required status checks to make it a gate.
# Actions are pinned to a 40-character commit SHA, never a floating tag (standing-versions rule).
name: governance-trace

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: governance-trace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  governance-trace:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the base commit (policy, boundaries, operators)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the PR merge commit (read only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: pr
          persist-credentials: false
      - name: Check out the plugin at the locked version
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: lukasrepublic/agentic-foundry
          ref: <PLUGIN_REF>
          path: plugin
          persist-credentials: false
      - name: Read the PR, its paged file list and its ticket
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json number,body > pr.json
          gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[] | ({path: .filename}, (if .previous_filename then {path: .previous_filename} else empty end))' | jq -s . > files.json
          REF="$(python3 plugin/governance/kits/delivery/checks/governance-trace.py ticket-ref --pr-json pr.json)"
          N="${REF##*#}"
          R="${REF%#*}"
          gh issue view "$N" --repo "${R:-$REPO}" --json number,body,labels,author > ticket.json
      - name: governance-trace
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/plugin
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: >-
          python3 plugin/governance/kits/delivery/checks/governance-trace.py check
          --pr-json pr.json --files-json files.json --ticket-json ticket.json --repo "$REPO" --agent-login "$ACTOR"
          --project-dir pr --base-dir base
