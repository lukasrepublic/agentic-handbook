# CI template for a CODE repository governed from this workspace — copy to
# `.github/workflows/ci.yml` in the code repo and replace the `run:` lines with the repo's own
# commands. The shape is the point (OPERATING-MODEL.md, "The loop"):
#
#   * CI runs on pull requests that are READY FOR REVIEW, never on drafts. Iterate on a draft,
#     prove `Done means` locally (foundry-test.sh), then mark the PR ready — CI confirms once.
#   * A new push cancels the superseded run for the same branch (`concurrency`).
#   * Documentation-only changes do not run the pipeline. Docs live in the workspace repo; a
#     docs-only PR to a code repo is a defect (branch-discipline rule 7). NOTE: GitHub leaves a
#     path-filtered required check in the "Expected" state, so such a PR is blocked from merging
#     by design — put the words in the workspace repo instead.
#   * DEPLOY ON PROMOTE, NOT ON MERGE. A merge to `main` is integration. The image build and the
#     GitOps write-back run only when the operator promotes: EITHER push a `v*` tag, OR add the
#     `deploy/staging` label to a merged PR. Both triggers are wired below; keep one or both.
#
#   * BUDGETS ARE COMMANDS, NOT GATES. A performance or request-count budget (Lighthouse, a bundle
#     size limit, a load-test threshold) is a command you run and report in the PR. It is not a
#     required check: a noisy number that blocks every merge teaches people to retry and then to
#     disable it. `foundry_ci_budget_lint.py` flags a budget job wired as required.
#   * GOVERNANCE-TRACE ties each PR to its ticket's `## Design`. It reads policy from the PR's BASE
#     commit (a PR cannot loosen the class that grades it), only reads the PR checkout, and runs the
#     check from the plugin at the version in `.foundry/governance.lock`. Replace <PLUGIN_REF> with
#     that version's 40-character commit, and add `governance-trace` to the required checks. The
#     governance kit ships the same job: `governance/kits/delivery/checks/governance-trace.yml.template`
#     in the plugin. The `paths-ignore` filter below also skips this job, so if you make it required, move
#     it to its own workflow without a path filter, or a docs-only PR waits on it forever.
#
# Actions are pinned to a 40-character commit SHA, never a floating tag (standing-versions rule).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "specs/**"
      - "status-reports/**"
  push:
    tags:
      - "v*"                      # promote: a release tag builds and deploys

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-trace:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out the base commit (policy, boundaries, operators)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the PR merge commit (read only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: pr
          persist-credentials: false
      - name: Check out the plugin at the locked version
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: lukasrepublic/agentic-foundry
          ref: <PLUGIN_REF>
          path: plugin
          persist-credentials: false
      - name: Read the PR, its paged file list and its ticket
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json number,body > pr.json
          gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[] | ({path: .filename}, (if .previous_filename then {path: .previous_filename} else empty end))' | jq -s . > files.json
          REF="$(python3 plugin/governance/kits/delivery/checks/governance-trace.py ticket-ref --pr-json pr.json)"
          N="${REF##*#}"
          R="${REF%#*}"
          gh issue view "$N" --repo "${R:-$REPO}" --json number,body,labels,author > ticket.json
      - name: governance-trace
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/plugin
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: >-
          python3 plugin/governance/kits/delivery/checks/governance-trace.py check
          --pr-json pr.json --files-json files.json --ticket-json ticket.json --repo "$REPO" --agent-login "$ACTOR"
          --project-dir pr --base-dir base

  test:
    # Skip drafts. `github.event.pull_request` is empty on a tag push, which also evaluates false.
    # An `edited` event (title or body change) re-runs only governance-trace, never the tests.
    if: github.event.pull_request.draft == false && github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The repository's own test command (what foundry-test.sh ran locally)
        run: |
          set -euo pipefail
          # Replace with the repo's real command — Taskfile `task ci`, `make test`, `npm test`,
          # `pytest` — the same one `foundry-test.sh` runs before the push.
          echo "replace me: run the repository's CI command here" && exit 1

  deploy:
    # Promote-gated: a `v*` tag, or the `deploy/staging` label on a pull request. Never on a
    # plain merge to `main`. Either trigger alone is enough; delete the one you do not use.
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy/staging'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the image and write the new digest back to the GitOps repo
        run: |
          set -euo pipefail
          # Replace with the repo's real build + write-back. Tag the image with the git SHA (and
          # the `v*` tag when present); never `:latest`.
          echo "replace me: build image, push by digest, update the GitOps manifest" && exit 1
