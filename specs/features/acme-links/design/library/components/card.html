<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card — Acme Links</title>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
  <div class="card" style="max-width:var(--width-card)">
    <h3 class="card-header">Create a short link</h3>
    <div class="card-body">
      <div class="field" style="max-width:none">
        <label class="label" for="x">Long URL</label>
        <input class="input" id="x" placeholder="https://example.com/…">
      </div>
    </div>
    <div class="card-footer row" style="justify-content:flex-end">
      <button class="btn btn-ghost">Cancel</button>
      <button class="btn btn-primary">Shorten</button>
    </div>
  </div>
</body></html>
